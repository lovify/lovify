<style>
:root{--w1:#7A0020;--w2:#4A0012;--cr:#C8102E;--cream:#FBEFE3;--gold:#D4A935;--ink:#2B0A12;--r:22px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
body{font:400 16px/1.75 Cairo,Tajawal,sans-serif;background:var(--cream);color:var(--ink);overflow-x:hidden}
h1,h2,h3{font-family:'Reem Kufi',Cairo,sans-serif;color:var(--w1);line-height:1.35}
[dir=ltr] h1,[dir=ltr] h2,[dir=ltr] h3{font-family:'Cormorant Garamond',Georgia,serif}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.c{width:min(1120px,calc(100% - 32px));margin-inline:auto}
section{padding:60px 0}
.sh{text-align:center;margin-bottom:30px}.sh h2{font-size:clamp(1.7rem,6vw,2.5rem)}.sh p{opacity:.8}
.b{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:99px;font:700 1rem Cairo,sans-serif;text-decoration:none;border:2px solid transparent;cursor:pointer;transition:.25s}
.b1{background:linear-gradient(135deg,var(--w1),var(--w2));color:#fff;box-shadow:0 6px 18px #7a002040}
.b1:hover{box-shadow:0 0 0 4px #c8102e26,0 10px 26px #7a002066}
.b2{border-color:var(--w1);color:var(--w1)}.b2:hover{background:#7a00200f}
.ib{width:44px;height:44px;border-radius:50%;border:1.5px solid #7a002040;background:transparent;color:var(--w1);font:700 .95rem Cairo,sans-serif;cursor:pointer}
/* header */
header{position:sticky;top:0;z-index:50;background:#fbefe3f7;border-bottom:1px solid #7a002018;padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:10px;min-height:68px}
.lg{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--w1);font:700 1.3rem 'Cormorant Garamond',serif;margin-inline-end:auto}
.lg img{width:56px;height:56px;border-radius:50%}
.nv{display:none;gap:20px;margin-inline:auto}.nv a{color:var(--ink);text-decoration:none;font-weight:600;padding:10px 2px}.nv a:hover{color:var(--cr)}
.hcta{display:none;min-height:44px;padding:0 20px}
@media(min-width:1000px){.nv{display:flex}.hcta{display:inline-flex}.bg{display:none}}
.pn{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(86vw,340px);background:var(--cream);z-index:70;padding:16px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;transform:translateX(100%);visibility:hidden;transition:transform .35s,visibility .35s;box-shadow:-8px 0 30px #0005;overflow-y:auto}
[dir=rtl] .pn{transform:translateX(-100%)}
.mo .pn{transform:none;visibility:visible}
.pn .ib{align-self:flex-end}.pn .l{display:flex;align-items:center;min-height:48px;padding:0 6px;font-weight:700;color:var(--w1);text-decoration:none;border-bottom:1px solid #7a002014}
.ov{position:fixed;inset:0;background:#2b0a1299;z-index:60;opacity:0;pointer-events:none;transition:.3s}.mo .ov{opacity:1;pointer-events:auto}
/* hero */
.hero{position:relative;overflow:hidden;padding:36px 0 56px;background:radial-gradient(circle at 85% 0,#c8102e22,transparent 55%),radial-gradient(circle at 0 100%,#d4a93533,transparent 50%),var(--cream)}
.hg{display:grid;gap:30px;align-items:center;position:relative}
@media(min-width:900px){.hg{grid-template-columns:1.1fr .9fr}}
.hero h1{font-size:clamp(2rem,8.6vw,3.7rem)}.hero p{font-size:1.1rem;max-width:34em;margin:14px 0 24px}
.bt{display:flex;flex-wrap:wrap;gap:12px}
.fh{position:absolute;bottom:-30px;color:var(--cr);opacity:0;animation:up linear infinite;pointer-events:none}
@keyframes up{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.45}100%{transform:translateY(-105vh) rotate(25deg) scale(1.1);opacity:0}}
/* phone */
